name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["apps/**"]
  pull_request:
    paths-ignore: ["apps/**"]

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build must succeed without real secrets — features degrade to
          # honest "not configured" states. These are placeholders only.
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
