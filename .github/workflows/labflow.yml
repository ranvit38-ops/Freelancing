name: LabFlow CI

on:
  push:
    branches: ["**"]
    paths: ["apps/labflow/**", ".github/workflows/labflow.yml"]
  pull_request:
    paths: ["apps/labflow/**", ".github/workflows/labflow.yml"]

defaults:
  run:
    working-directory: apps/labflow

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest

    # A real database, so the workspace-isolation tests actually run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: labflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/labflow

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/labflow/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply schema
        run: npm run db:push

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
